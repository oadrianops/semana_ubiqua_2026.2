# Segurança (seção 16.6): CodeQL (Java e TypeScript), Gitleaks, Trivy e revisão de dependências no PR.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compilar o backend
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests -Dspotless.check.skip=true compile
      - uses: github/codeql-action/analyze@v4

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks (sem segredos no histórico)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  trivy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Trivy (arquivos e dependências)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Não consulta o Maven Central ao resolver os POMs (evita o 429); a base de vulnerabilidades é baixada.
          TRIVY_OFFLINE_SCAN: "true"
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: frontend/node_modules
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
