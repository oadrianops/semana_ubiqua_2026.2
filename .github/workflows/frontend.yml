# Frontend (seção 16.6): lint, tipos, testes com cobertura, paridade de i18n, build, orçamentos e detector de design.
name: frontend

on:
  pull_request:
    paths: ["frontend/**", "contracts/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "contracts/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (acessibilidade e textos fixos)
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Testes com cobertura (≥ 70%)
        run: npm run coverage
      - name: Paridade de i18n (pt-BR, en, es)
        run: npm run i18n:check
      - name: Build
        run: npm run build
      - name: Orçamentos de performance (seção 9.14)
        run: npm run size
      - name: Detector de design (impeccable)
        run: npx --yes impeccable@4.7.0 detect src
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14
