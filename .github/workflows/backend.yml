# Backend (seção 16.6): unitários, integração com Testcontainers, Spotless, JaCoCo, ArchUnit e contrato OpenAPI.
name: backend

on:
  pull_request:
    paths: ["backend/**", "contracts/**", "docs/api/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "contracts/**", "docs/api/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: ./mvnw verify (unitários, *IT com MySQL 8.4, Spotless, JaCoCo, ArchUnit, OpenAPI)
        run: ./mvnw -B -ntp verify
        env:
          CI: "true"
      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          retention-days: 14
