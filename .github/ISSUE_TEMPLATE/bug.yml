name: Defeito
description: Algo que não funciona como a especificação diz
labels: ["tipo:bug"]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu
      description: Passos, tela, idioma e aparelho. Não inclua senhas, chaves PIX nem dados pessoais.
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations: { required: true }
  - type: input
    id: requisitos
    attributes:
      label: Requisito afetado
      placeholder: "RF-xx · RN-xx"
  - type: dropdown
    id: rede
    attributes:
      label: Rede no momento
      options: ["Wi-Fi", "4G", "3G / sinal fraco", "Sem conexão", "Não sei"]
