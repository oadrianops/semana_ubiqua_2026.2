# Cabeçalhos de segurança (seção 12.5). Incluir em CADA location que tiver add_header: no Nginx, um add_header
# dentro de location faz os do nível do server deixarem de ser herdados (seção 16.4).
# Se o provedor de tiles do mapa mudar (WEB_MAP_TILE_URL), ajustar o img-src abaixo.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
