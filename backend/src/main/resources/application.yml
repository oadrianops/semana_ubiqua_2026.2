# Configuração base (especificação 16.5). Tudo sobrescrevível por variáveis de ambiente (RNF-11).
spring:
  application:
    name: nandesk-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nandesk}
    username: ${SPRING_DATASOURCE_USERNAME:nandesk_app}
    password: ${SPRING_DATASOURCE_PASSWORD:troque-me}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 2
      connection-timeout: 3000
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        characterEncoding: UTF-8
        cachePrepStmts: true
        prepStmtCacheSize: 250
        useServerPrepStmts: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        default_batch_fetch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:25}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:false}
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: nandesk-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
        nandesk.search.latency: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:false}
  default-produces-media-type: application/json

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    org.hibernate.orm.deprecation: error

app:
  time-zone: America/Belem
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  storage:
    local-path: ${APP_STORAGE_LOCAL_PATH:./data/uploads}
  legal:
    terms-version: "2026-10"
  jwt:
    issuer: ${APP_JWT_ISSUER:nandesk}
    audience: ${APP_JWT_AUDIENCE:nandesk-web}
    key-id: ${APP_JWT_KEY_ID:dev}
    private-key-path: ${APP_JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${APP_JWT_PUBLIC_KEY_PATH:}
    private-key-pem: ${APP_JWT_PRIVATE_KEY:}
    public-key-pem: ${APP_JWT_PUBLIC_KEY:}
  crypto:
    pix-key: ${APP_CRYPTO_PIX_KEY:}
  auth:
    refresh-cookie-secure: ${APP_REFRESH_COOKIE_SECURE:false}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:nao-responda@nandesk.com.br}
    contact: ${APP_CONTACT_EMAIL:contato@nandesk.com.br}
  push:
    vapid-public-key: ${APP_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${APP_PUSH_VAPID_PRIVATE_KEY:}
    vapid-subject: ${APP_PUSH_VAPID_SUBJECT:mailto:contato@nandesk.com.br}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    default-password: ${SEED_DEFAULT_PASSWORD:}
    admin-password: ${SEED_ADMIN_PASSWORD:}
