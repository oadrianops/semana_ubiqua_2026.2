# Perfil dev: seed, Swagger, CORS para o Vite (5173), Mailpit e logs em texto (16.5).
spring:
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    default-password: ${SEED_DEFAULT_PASSWORD:troque-me-dev}

logging:
  level:
    br.com.nandesk: debug
